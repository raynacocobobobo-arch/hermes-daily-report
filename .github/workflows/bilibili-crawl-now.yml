name: Bilibili public crawl preview

on:
  workflow_dispatch:
    inputs:
      date:
        description: Target date in Asia/Shanghai (YYYY-MM-DD)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - scripts/bilibili-crawl-public.py
      - .github/workflows/bilibili-crawl-now.yml

permissions:
  contents: write

concurrency:
  group: bilibili-public-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Crawl public subtitles
        env:
          TARGET_DATE: ${{ github.event.inputs.date || '' }}
        run: python scripts/bilibili-crawl-public.py

      - name: Commit preview result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crawl-preview/
          if git diff --cached --quiet; then
            echo "No crawl output changes"
            exit 0
          fi
          git commit -m "抓取B站公开字幕预览"
          git push
